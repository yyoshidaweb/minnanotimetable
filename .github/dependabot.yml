version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly         # 毎週実行
      day: friday              # 金曜日
      time: "00:00"            # 00:00
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1  # PR上限を1に制限
    groups:
      bundler-updates:          # すべてのGem更新を1つにまとめる
        applies-to: version-updates
        patterns:
          - "*"
      bundler-security:         # セキュリティ更新を1つにまとめる
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "00:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    groups:
      actions-updates:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
